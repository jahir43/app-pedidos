<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Pedidos - Fast Food</title>
    <style>
        html, body { background-color: #f4f7f6; margin: 0; padding: 0; }
    </style>
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>

<div class="container">
    <h1>🍔 Sistema de Pedidos</h1>

    <div class="panel">
        <h3>🍱 Catálogo de Productos</h3>
     <div class="catalogo-grid">
    <div class="producto-card" onclick="seleccionarProducto('Empanada', 6000)">
        <img src="empanada1.jpeg" alt="Empanada">
        <p>Empanada<br><strong>$6.000</strong></p>
    </div>
    <div class="producto-card" onclick="seleccionarProducto('Perro Caliente', 8000)">
        <img src="hotdog.webp" alt="Perro">
        <p>Perro<br><strong>$8.000</strong></p>
    </div>
    <div class="producto-card" onclick="seleccionarProducto('Hamburguesa', 20000)">
        <img src="hamburguesa.webp" alt="Hamburguesa">
        <p>Burguer<br><strong>$20.000</strong></p>
    </div>
    <div class="producto-card" onclick="seleccionarProducto('Papas Fritas', 7000)">
                    <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=200&auto=format&fit=crop&q=60" alt="Papas">
                    <p>Papas Fritas<br><strong>$7.000</strong></p>
                </div>
                <div class="producto-card" onclick="seleccionarProducto('Gaseosa', 4500)">
                    <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=200&auto=format&fit=crop&q=60" alt="Bebida">
                    <p>Baseosa<br><strong>$4.500</strong></p>
                </div>
</div>
    </div>

    <div class="grid">
        <div class="panel" id="panel-manual">
            <h3>➕ Detalle del Pedido</h3>
            
            <input type="hidden" id="pedido-id">
            
            <label for="producto">Nombre del producto:</label>
            <input type="text" id="producto" placeholder="Selecciona arriba o escribe...">

            <label for="precio">Precio unitario:</label>
            <input type="number" id="precio" placeholder="Ej: 20000">

            <div class="precios-rapidos">
                <button type="button" class="btn-fast" onclick="fijarPrecio(6000)">$6k</button>
                <button type="button" class="btn-fast" onclick="fijarPrecio(8000)">$8k</button>
                <button type="button" class="btn-fast" onclick="fijarPrecio(20000)">$20k</button>
            </div>

            <label>Cantidad:</label>
            <div class="cantidad-box">
                <button type="button" onclick="cambiarCantidad(-1)">➖</button>
                <span id="cantidad">1</span>
                <button type="button" onclick="cambiarCantidad(1)">➕</button>
            </div>

            <button type="button" id="btn-agregar" class="agregar">
                Añadir al pedido
            </button>
        </div>

        <div class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>🛒 Cuenta Actual</h3>
                <input type="text" id="buscador" placeholder="🔍 Buscar..." style="width: 40%; margin: 0; padding: 5px;">
            </div>

            <ul id="lista" class="lista-pedidos"></ul>

            <div class="total-section">
                <h2 id="total">Total: $0</h2>
                <button type="button" id="btn-finalizar" class="btn-finalizar">
                    ✅ FINALIZAR Y COBRAR
                </button>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>📜 Últimas Ventas (Historial)</h3>
        <div id="historial-ventas" class="historial-lista">
            <p style="color: #888; text-align: center;">Cargando historial...</p>
        </div>
    </div>

    <div class="dashboard-resumen">
        <div class="stat">
            Ventas del día: <span id="totalVentas">$0</span>
        </div>
        <div class="stat">
            Top: <span id="masVendido">-</span>
        </div>
    </div>
</div>

<script src="script.js?v=13"></script>

</body>
</html>
