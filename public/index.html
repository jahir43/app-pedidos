<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Pedidos - Fast Food</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🍔 App Pedidos</h1>

    <div class="slider-container">
        <button class="prev" onclick="moverSlide(-1)">❮</button>
        <div class="slider" id="slider">
            
            <div class="slide">
                <img src="https://www.recetasnestle.com.ec/sites/default/files/srh_recipes/4e4293857c03d819e4ae51de1e86d66a.jpg" alt="Hamburguesa">
                <h3>Hamburguesa</h3>
                <p>$20.000</p>
                <button onclick="agregarDirecto('Hamburguesa', 20000)">Agregar</button>
            </div>

            <div class="slide">
                <img src="https://images.unsplash.com/photo-1628591470762-d26456046702?q=80&w=500" alt="Empanada">
                <h3>Empanada de carne</h3>
                <p>$6.000</p>
                <button onclick="agregarDirecto('Empanada', 6000)">Agregar</button>
            </div>

            <div class="slide">
                <img src="https://comedera.com/wp-content/uploads/sites/9/2022/03/Pan-de-perro-caliente-shutterstock_1472131574.jpg" alt="Perro caliente">
                <h3>Perro caliente</h3>
                <p>$8.000</p>
                <button onclick="agregarDirecto('Perro caliente', 8000)">Agregar</button>
            </div>

            <div class="slide">
                <img src="https://mandolina.co/wp-content/uploads/2023/10/papas-fritas-saludables-1080x550-1-1200x900.jpg" alt="Papas fritas">
                <h3>Papas fritas</h3>
                <p>$5.000</p>
                <button onclick="agregarDirecto('Papas fritas', 5000)">Agregar</button>
            </div>

        </div>
        <button class="next" onclick="moverSlide(1)">❯</button>
    </div>

    <div class="grid">
        <div class="panel">
            <h3 id="form-title">Nuevo pedido</h3>
            <input type="hidden" id="pedido-id">
            
            <input type="text" id="producto" placeholder="Nombre del producto">
            <input type="number" id="precio" placeholder="Precio unitario">

            <div class="precios-rapidos" style="display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0;">
                <button type="button" class="btn-fast" onclick="fijarPrecio(5000)">$5k</button>
                <button type="button" class="btn-fast" onclick="fijarPrecio(10000)">$10k</button>
                <button type="button" class="btn-fast" onclick="fijarPrecio(15000)">$15k</button>
                <button type="button" class="btn-fast" onclick="fijarPrecio(20000)">$20k</button>
                <button type="button" class="btn-fast" onclick="fijarPrecio(25000)">$25k</button>
            </div>

            <div class="cantidad-box">
                <button onclick="cambiarCantidad(-1)">➖</button>
                <span id="cantidad">1</span>
                <button onclick="cambiarCantidad(1)">➕</button>
            </div>

            <button id="btn-agregar" class="agregar" onclick="agregar()">Agregar al pedido</button>
            <button id="btn-cancelar" style="display:none; background:#6c757d; margin-top:10px" class="agregar" onclick="cancelarEdicion()">Cancelar Edición</button>
        </div>

        <div class="panel">
            <h3>Pedidos Actuales</h3>
            <input type="text" id="buscador" placeholder="🔍 Buscar pedido...">
            <ul id="lista"></ul>
            <h3 id="total">Total: $0</h3>
        </div>
    </div>

    <div class="grid" style="margin-top: 20px;">
        <div class="panel" style="text-align: center;">
            <h4>Ventas Totales</h4>
            <p id="totalVentas" style="font-size: 1.5rem; color: var(--success); font-weight: bold;">$0</p>
        </div>
        <div class="panel" style="text-align: center;">
            <h4>Más Vendido</h4>
            <p id="masVendido" style="font-size: 1.5rem; color: var(--warning); font-weight: bold;">-</p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
